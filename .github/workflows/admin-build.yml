name: Admin dashboard build
on:
  push:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package.json
      - run: npm install
      - run: npm run build
      - name: Deploy separate administration Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d871be22dc8c73b109a1075ee5a911a
          command: deploy
          workingDirectory: admin-dashboard
      - name: Deployment skipped until Cloudflare token is configured
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Admin build passed. Configure Worker secrets and CLOUDFLARE_API_TOKEN before deployment."
