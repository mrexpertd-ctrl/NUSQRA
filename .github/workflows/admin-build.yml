name: Admin dashboard build and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package.json
      - run: npm install
      - run: npm run build
      - name: Validate Worker bundle syntax
        run: npx esbuild src/worker.js --bundle --platform=browser --format=esm --external:@supabase/supabase-js --outfile=/tmp/nusqra-admin-worker-check.js
