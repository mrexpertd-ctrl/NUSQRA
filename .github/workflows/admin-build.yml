name: Admin dashboard build
on:
  push:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package.json
      - run: npm install
      - run: npm run build
