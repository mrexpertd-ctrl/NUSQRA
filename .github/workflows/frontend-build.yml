name: NUSQRA frontend build

on:
  push:
    branches: [main]
    paths:
      - "nusqra-starter/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "nusqra-starter/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oybodlncqgerucwwkqvp.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MHBtLOwXxBQmfK6uNzZtww_uIW33AQa
    defaults:
      run:
        working-directory: nusqra-starter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production website
        run: npm run build
      - name: Deploy NUSQRA Worker to Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d871be22dc8c73b109a1075ee5a911a
          command: deploy --config ../wrangler.jsonc
          workingDirectory: nusqra-starter

      - name: Deployment skipped until Cloudflare token is configured
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Build passed. Add CLOUDFLARE_API_TOKEN in repository Actions secrets to enable deployment."
