name: NUSQRA Admin dashboard build and deploy

on:
  push:
    branches: [main]
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 7d871be22dc8c73b109a1075ee5a911a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test admin dashboard
        run: |
          npm run build
          node --test
      - name: Deploy private admin Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        # Wrangler inherits the two existing Worker secrets.
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Deployment skipped until Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Build passed. Add CLOUDFLARE_API_TOKEN in repository Actions secrets to enable deployment."
