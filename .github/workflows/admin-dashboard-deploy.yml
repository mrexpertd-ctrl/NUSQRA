name: NUSQRA Admin dashboard build and deploy

on:
  push:
    branches: [main]
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPREME_ADMIN_EMAIL: ${{ secrets.SUPREME_ADMIN_EMAIL }}
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN Actions secret." && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY Actions secret." && exit 1)
          test -n "$SUPREME_ADMIN_EMAIL" || (echo "Missing SUPREME_ADMIN_EMAIL Actions secret." && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build admin dashboard
        run: npm run build
      - name: Set server-only Worker secrets
        run: |
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.jsonc
          printf '%s' "$SUPREME_ADMIN_EMAIL" | npx wrangler secret put SUPREME_ADMIN_EMAIL --config wrangler.jsonc
      - name: Deploy private admin Worker
        run: npx wrangler deploy --config wrangler.jsonc
